<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donut · Placement Admin</title><style>:root{color-scheme:dark;--bg:#0d0b0c;--panel:#181214;--ink:#f8f2ec;--muted:#b9a8ad;--accent:#b93b61;--line:rgba(255,255,255,.14)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(122,23,52,.28),transparent 35%),var(--bg);color:var(--ink);font:15px system-ui,sans-serif}.wrap{width:min(1100px,calc(100% - 28px));margin:50px auto}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:30px}h1{font-size:clamp(2.3rem,6vw,5rem);letter-spacing:-.07em;margin:8px 0}.eyebrow{color:#d85b7f;text-transform:uppercase;letter-spacing:.14em;font-size:.72rem}.login{display:flex;gap:8px}input,button{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);color:var(--ink)}button{cursor:pointer;font-weight:700}.primary{background:linear-gradient(135deg,#b93b61,#7a1734)}#message{color:var(--muted);min-height:22px}.grid{display:grid;gap:12px}.card{display:grid;grid-template-columns:90px 150px 1fr auto;gap:18px;align-items:center;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:16px;padding:18px}.id{font-size:1.5rem;font-weight:800}.status{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#efb8ca}.details{color:var(--muted);line-height:1.5;overflow-wrap:anywhere}.details a{color:#efb8ca}.actions{display:flex;gap:8px}.sold{background:#76203d}.reopen{background:#292326}@media(max-width:760px){header{display:block}.login{margin-top:20px;display:grid}.card{grid-template-columns:70px 1fr}.details,.actions{grid-column:1/-1}.actions button{flex:1}}</style></head><body><main class="wrap"><header><div><p class="eyebrow">Private inventory controls</p><h1>Placement admin</h1><p id="message">Enter the private admin token configured in Cloudflare.</p></div><div class="login"><input id="token" type="password" autocomplete="current-password" placeholder="Admin token"><button class="primary" id="load">Open dashboard</button></div></header><section class="grid" id="admin-grid"></section></main><script src="./admin.js"></script></body></html>
